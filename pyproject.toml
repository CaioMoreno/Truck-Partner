[project]
name = "truck-system"
version = "0.1.0"
description = "A Python and PostgreSQL CLI application for managing drivers, trucks, cargoes, and logistics trips."
readme = "README.md"
authors = [
    { name = "Caio", email = "caiomoreno.caio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
truck-system = "main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
